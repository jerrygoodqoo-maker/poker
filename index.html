<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#0e1512;--panel:#15201b;--line:#25362e;--text:#e8efe9;--mute:#8fa598;--gold:#d9b45a;--me:#1f3a2e;--bot:#1a2621}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f1f4ef;--panel:#fff;--line:#d5ddd5;--text:#1b2a22;--mute:#5d7064;--gold:#9a7416;--me:#dcecdf;--bot:#fff;color-scheme:light}}
*{box-sizing:border-box}
html,body{height:100vh;height:100dvh;margin:0;overflow:hidden}
body{background:var(--bg);color:var(--text);font:15px/1.65 -apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;display:flex;flex-direction:column}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--panel);flex-shrink:0}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand svg{width:44px;height:44px;flex:none;border-radius:50%;background:#26382f}
.brand b{font-size:17px;letter-spacing:.05em}
.brand small{display:block;color:var(--mute);font-size:12px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.actions{display:flex;gap:6px;flex-shrink:0}
.icon-btn{background:transparent;color:var(--mute);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:12px;cursor:pointer;white-space:nowrap}
.icon-btn:hover,.icon-btn.active{color:var(--gold);border-color:var(--gold)}
#log{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:12px;-webkit-overflow-scrolling:touch}
.m{max-width:88%;padding:10px 13px;border-radius:14px;border:1px solid var(--line);word-wrap:break-word;overflow-wrap:anywhere}
.m.bot{background:var(--bot);align-self:flex-start;border-top-left-radius:4px}
.m.me{background:var(--me);align-self:flex-end;border-top-right-radius:4px}
.m b{color:var(--gold)}
.m code{background:rgba(127,127,127,.18);padding:1px 5px;border-radius:4px;font-size:13px}
.m ul{margin:4px 0;padding-left:20px}
.m p{margin:4px 0}
#chips{display:flex;gap:8px;overflow-x:auto;padding:8px 14px 2px;flex-shrink:0;-webkit-overflow-scrolling:touch}
#chips::-webkit-scrollbar{display:none}
#chips button{flex:none;background:transparent;color:var(--gold);border:1px solid var(--gold);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer}
form{display:flex;gap:8px;padding:10px 14px 12px;flex-shrink:0}
textarea{flex:1;resize:none;height:44px;max-height:120px;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font:16px/1.4 -apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif}
#send{background:var(--gold);color:#16130a;border:0;border-radius:12px;padding:0 18px;font-weight:700;font-size:15px;cursor:pointer;flex-shrink:0}
#send:disabled{opacity:.5}
.dim{color:var(--mute);font-size:12px;text-align:center;padding:2px 14px 4px;flex-shrink:0}

/* 設定彈窗 */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.68);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
#modal.open{display:flex}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;max-width:440px;width:100%;max-height:90dvh;overflow-y:auto;padding:18px;box-shadow:0 12px 32px rgba(0,0,0,.4)}
.card h3{margin:0 0 8px;color:var(--gold);font-size:17px}
.card p{margin:0 0 10px;font-size:13px;color:var(--mute);line-height:1.5}
.card label{display:block;font-size:12px;color:var(--mute);margin:10px 0 4px}
.card input,.card select{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:15px}
.card a{color:var(--gold)}
.detect-row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:8px;flex-wrap:wrap}
.detect-btn{background:transparent;color:var(--gold);border:1px solid var(--gold);border-radius:8px;padding:5px 10px;font-size:12px;cursor:pointer}
#detect-msg{font-size:12px;color:var(--mute)}
.model-chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;max-height:110px;overflow-y:auto}
.m-chip{font-size:11px;padding:4px 9px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--text);cursor:pointer}
.m-chip:hover,.m-chip.sel{border-color:var(--gold);color:var(--gold)}
.saved-pills{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.pill{font-size:11px;padding:3px 9px;border-radius:999px;border:1px solid var(--line);color:var(--mute);cursor:pointer}
.pill.on{border-color:var(--gold);color:var(--gold)}
.modal-btns{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.modal-btns button{padding:8px 14px;border-radius:10px;font-size:14px;cursor:pointer;border:1px solid var(--line);background:transparent;color:var(--text)}
.modal-btns button.primary{background:var(--gold);color:#16130a;border:0;font-weight:700}
</style>
</head>

【人設】你是「小撲」，老練的現場德撲教練。穿大學T、戴帽子與墨鏡，撲克臉、話少、酷、偶爾冷幽默，不洩露情緒，但教得很實在、直言不諱。目標：把學員訓練成接近GTO的打法（混合頻率、多種下注尺度、依對手行動線決定Hero Call／棄牌），並教會何時偏離GTO做剝削調整。用繁體中文回答，口吻像坐在牌桌旁低聲指點。
【輸出規則】結論先行，再給細節；簡單問題短答。善用粗體與條列，不要用表格。給範圍時要給頻率（例如「約70%下注、30%過牌」），不要只說「一定」。涉及混合策略要說明「為何混合」。重要判斷標註信心（高/中/低），並區分「GTO基準」「剝削調整」「純猜測」。缺關鍵資訊（位置、籌碼深度、對手類型、下注額、牌面）時只問最關鍵的一個問題。每次分析決策類問題，結尾加一行「這個答案最可能出錯的2點」。偶爾（不要每次）出一道小練習題考學員。不提供任何來源以外的精確數字假裝是Solver輸出；超出下方知識庫時要說明是推論。
【知識庫：6-Max 100bb 基準】
位置與開牌率：UTG 15–17%；HJ 19–21%；CO 27–30%；BTN 42–48%；SB 36–42%（Raise or Fold，不Limp）；BB防守35–55%。
開牌尺度：UTG/HJ/CO/BTN 2.2–2.5bb；SB vs BB 3.0bb；對Limper隔離加注 3bb+每位Limper再加1bb。
RFI：
UTG~16%：AA–66；AKs–ATs,KQs–KJs,QJs,JTs,T9s；AKo–AQo,KQo；邊緣55,A9s,A5s,98s（後位激進時棄，桌風被動可加）。
HJ~20%：AA–55；AKs–A8s,A5s–A4s,KQs–KTs,QJs–QTs,JTs,T9s,98s；AKo–AJo,KQo；邊緣44,A7s–A6s,K9s,87s,KJo。
CO~28%：AA–33；AKs–A2s,KQs–K8s,QJs–Q9s,JTs–J9s,T9s–T8s,98s,87s,76s；AKo–ATo,KQo–KJo,QJo；邊緣22,K7s,Q8s,65s,A9o,JTo。
BTN~45%：AA–22；AKs–A2s,KQs–K2s,QJs–Q5s,JTs–J7s,T9s–T7s,98s–96s,87s–86s,76s–75s,65s–64s,54s；AKo–A7o,KQo–K9o,QJo–Q9o,JTo–J9o,T9o；邊緣A6o–A4o,Q4s–Q2s,98o,87o（盲注緊弱可擴至50%+）。
SB~40%：AA–22；AKs–A2s,KQs–K4s,QJs–Q6s,JTs–J7s,T9s–T7s,98s–96s,87s–86s,76s–75s,65s,54s；AKo–A8o,KQo–K9o,QJo–Q9o,JTo–J9o,T9o；邊緣A7o–A5o,K3s–K2s,87o。
3-Bet原則：有位置或SB用線性3-Bet（最強+次強活牌）；BB用極化3-Bet（頂級強牌+A5s–A2s,K9s等阻斷牌邊緣同花），中等牌放跟注。
3-Bet/4-Bet尺度：IP 3-Bet=對手開牌×3；OOP（SB/BB）×3.5–4（BTN開2.5→9–10bb）；4-Bet IP 為3-Bet的2.2–2.4倍（約20–22bb），OOP 2.5–2.7倍（約22–24bb）。
開牌後面對3-Bet（核心：剔除易被支配的非同花高張KQo,AJo,KJo,ATo；同花連張JTs,T9s,98s與中對99–66有位置時隱含賠率佳）：
UTG開 vs MP/CO 3-Bet（OOP）：4-Bet價值AA,KK,AKs（QQ,AKo混合）；詐唬A5s,A4s低頻；跟注QQ–99,AKo,AQs–AJs,KQs；棄ATo,KQo,KJs,QJs,88–66。
CO開 vs BTN 3-Bet（OOP）：4-Bet價值AA–QQ,AKs–AKo；詐唬A5s–A4s,KJs,QJs部分頻率；跟注JJ–77,AQs–ATs,KQs,JTs,T9s,98s；棄AJo–ATo,KQo–KJo,QJo,66–33。
CO開 vs SB/BB 3-Bet（IP）：4-Bet價值AA–JJ,AKs–AKo,AQs；詐唬A5s–A3s,KTs,QTs,J9s；跟注TT–55,AJs–A9s,KQs–KJs,QJs,JTs,T9s,98s,87s,AQo；棄ATo,KJo,QJo,44–33。
BTN開 vs SB/BB 3-Bet（IP）：4-Bet價值AA–TT,AKs–AQo；詐唬A9s–A6s,A5s–A2s,K9s,Q9s,J9s,T8s混合；跟注99–44,AJs–A8s,KQs–KTs,QJs–QTs,JTs,T9s,98s,87s,76s,65s,AJo,KQo；棄ATo–A7o,KJo–K9o,QJo–Q9o,33–22；BTN需防守約50–55%。
SB開 vs BB 3-Bet（OOP）：4-Bet價值AA–TT,AKs–AQo,AJs；詐唬A5s–A2s,K9s,Q9s,J8s,T8s；跟注99–55,ATs–A8s,KQs–KTs,QJs–QTs,JTs,T9s,98s,87s,AJo,KQo；棄KTo,QTo,JTo,A9o等弱非同花與無連張低同花。
翻牌後核心：範圍優勢決定下注「頻率」；堅果優勢決定下注「尺度」。不要100% CBet。
高張乾燥彩虹（A♠K♦4♣、K♥8♣2♦）：進攻方壓倒性優勢。IP 75–90%頻率、25–33%小注全範圍；OOP 60–75%、33%小注，被過牌加注輕鬆棄弱牌。
公對乾燥（Q♠Q♦5♣、7♥7♣2♠）：IP 80–95%、25–30%極小注；OOP 65–80%、33%小注保護中對。
中低連張濕潤（9♥8♥6♣、7♠6♠5♦）：防守方（BB）有兩對/暗三/順子堅果優勢。IP 30–45%極化、66–75%大注（超強牌+強聽牌，無聽牌高張過牌）；OOP 過牌70%+，只用超強牌與強組合聽牌大注。
單花色（J♠8♠3♠、A♥6♥2♥）：IP 35–50%、25–33%小注；OOP 過牌75%+，無同花別亂開火，保留強同花保護過牌範圍。
動態兩高張（Q♥J♥4♣、K♠T♠3♦）：IP 50–65%、50–75%中大注收聽牌價值；OOP 40–50%，小注大注混合，弱頂對/中對過牌控池。
轉牌：好開第二槍——高張驚悚牌（8♣5♦2♠後掉A/K）用純詐唬施壓；聽牌完成牌且我方有關鍵阻斷牌（如單張同花A）或後門權益時大注施壓。該減速——低張公對牌（K♠7♦4♣後掉4/7，防守方三條更多，空氣放棄，KJ/99過牌控池）；完全空白牌（2♦）且翻牌已被跟注，純空氣（無聽牌無高張）停火，只留半詐唬或強頂對以上。
河牌：薄價值——對手翻牌轉牌皆過牌-跟注（範圍封頂），安全河牌TPTK甚至強中對可下33–50%底池。河牌詐唬遵守阻斷牌優先：選錯失聽牌且阻斷對手「跟注範圍」的牌（同花完成面持單張A同花超池詐唬）；別用阻斷對手「棄牌範圍」的牌硬詐唬。抓詐唬：優先用「不阻斷對手錯失聽牌」的牌（紅心聽牌錯失時，沒有紅心的頂對/中對是最佳跟注候選）。
速查：A）UTG/HJ開AJo或KQo被3-Bet→直接棄。B）BTN開被BB跟注，翻7♠6♦5♣→高頻過牌控池或極化大注（BB堅果優勢）。C）UTG開被BTN跟注，翻A♦9♣3♠→高頻小注25–33%。D）3-Bet底池IP，翻K♠8♦3♣持A5s沒中→持續下注25–33%。
【教學風格補充】混合下注：說明「小注高頻吃全範圍、大注低頻極化」的邏輯，並給學員可執行的簡化版（如用骰子/手牌花色決定混合）。Hero Call：用「行動線」推演——對手範圍怎麼走到這條線、哪些價值組合/詐唬組合存在、我的牌有無阻斷、賠率需要多少勝率（底池賠率公式：跟注額÷(底池+跟注額)）。剝削：先講GTO基準，再依對手類型（過度跟注站、過度棄牌、激進3-Bet、被動）說明偏離方向與幅度，並提醒「對樣本不足的讀牌保持懷疑」。學員反駁時先重新檢查邏輯再決定是否改口，別為了順從而改答案。`;

    placeholder: '貼上 sk- 開頭的 DeepSeek Key…',
    defaultModel: 'deepseek-chat',
    presets: ['deepseek-chat', 'deepseek-reasoner']
  },
  openai: {
    label: 'OpenAI',
    type: 'openai',
    chatUrl: 'https://api.openai.com/v1/chat/completions',
    modelsUrl: 'https://api.openai.com/v1/models',
    keyUrl: 'https://platform.openai.com/api-keys',
    placeholder: '貼上 sk- 開頭的 OpenAI Key…',
    defaultModel: 'gpt-4o-mini',
    presets: ['gpt-4o-mini', 'gpt-4o', 'o4-mini']
  }
};

const STORE_PROVIDER = 'xiaopu_active_provider';
const STORE_KEYS = 'xiaopu_provider_keys';
const STORE_MODELS = 'xiaopu_provider_models';
const liveModelCache = {}; // 本次工作階段動態偵測到的真實模型快取

function cleanKey(k) {
  return (k || '').replace(/[^\x21-\x7E]/g, '');
}

function getKeys() {
  try {
    const obj = JSON.parse(localStorage.getItem(STORE_KEYS) || '{}');
    const legacy = cleanKey(localStorage.getItem('xiaopu_gemini_api_key'));
    if (legacy && !obj.gemini) {
      obj.gemini = legacy;
      localStorage.setItem(STORE_KEYS, JSON.stringify(obj));
    }
    return obj;
  } catch { return {}; }
}

function setKey(provider, key) {
  const obj = getKeys();
  const cleaned = cleanKey(key);
  if (cleaned) obj[provider] = cleaned;
  else delete obj[provider];
  localStorage.setItem(STORE_KEYS, JSON.stringify(obj));
  delete liveModelCache[provider];
}

function getModels() {
  try { return JSON.parse(localStorage.getItem(STORE_MODELS) || '{}'); }
  catch { return {}; }
}

function setModel(provider, model) {
  const obj = getModels();
  const m = (model || '').trim().replace(/^models\//, '');
  if (m) obj[provider] = m;
  else delete obj[provider];
  localStorage.setItem(STORE_MODELS, JSON.stringify(obj));
}

function getActiveProvider() {
  const p = localStorage.getItem(STORE_PROVIDER);
  return PROVIDERS[p] ? p : 'gemini';
}

const log = document.getElementById('log');
const t = document.getElementById('t');
const f = document.getElementById('f');
const send = document.getElementById('send');
const chipBox = document.getElementById('chips');
const modal = document.getElementById('modal');
const cfgBtn = document.getElementById('cfg-btn');
const clearBtn = document.getElementById('clear-btn');
const engineStatus = document.getElementById('engine-status');
const providerSelect = document.getElementById('provider-select');
const apiKeyInput = document.getElementById('api-key');
const apiModelInput = document.getElementById('api-model');
const modelChips = document.getElementById('model-chips');
const keyLink = document.getElementById('key-link');
const detectBtn = document.getElementById('detect-btn');
const detectMsg = document.getElementById('detect-msg');
const savedPills = document.getElementById('saved-pills');

let hist = [];
let busy = false;

function esc(s) {
  return String(s).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
}

function inl(s) {
  return s.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/`(.+?)`/g, '<code>$1</code>');
}

function md(s) {
  const L = esc(s).split('\n');
  let out = '', ul = false;
  for (const l of L) {
    const li = l.match(/^\s*[-*•]\s+(.*)/);
    if (li) {
      if (!ul) { out += '<ul>'; ul = true; }
      out += '<li>' + inl(li[1]) + '</li>';
      continue;
    }
    if (ul) { out += '</ul>'; ul = false; }
    const h = l.replace(/^#+\s*/, '');
    if (h.trim()) out += '<p>' + inl(h) + '</p>';
  }
  return out + (ul ? '</ul>' : '');
}

function add(role, text) {
  const d = document.createElement('div');
  d.className = 'm ' + role;
  d.innerHTML = role === 'me' ? '<p>' + esc(text) + '</p>' : md(text);
  log.appendChild(d);
  log.scrollTop = log.scrollHeight;
  return d;
}

function updateHeaderStatus() {
  const keys = getKeys();
  const active = getActiveProvider();
  const models = getModels();
  const hasAny = Object.keys(keys).length > 0;
  const activeModel = models[active] || PROVIDERS[active].defaultModel;

  if (!hasAny) {
    cfgBtn.textContent = '⚙️ 設定 Key';
    cfgBtn.classList.add('active');
    engineStatus.textContent = '尚未設定 API Key · 點右上角連線';
  } else {
    cfgBtn.textContent = `⚙️ ${PROVIDERS[active].label}`;
    cfgBtn.classList.remove('active');
    engineStatus.textContent = `引擎：${PROVIDERS[active].label} (${activeModel})`;
  }
}

function renderModelChips(list) {
  modelChips.innerHTML = '';
  const current = apiModelInput.value.trim();
  list.forEach(id => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'm-chip' + (id === current ? ' sel' : '');
    btn.textContent = id;
    btn.onclick = () => {
      apiModelInput.value = id;
      renderModelChips(list);
    };
    modelChips.appendChild(btn);
  });
}

function renderSavedPills() {
  const keys = getKeys();
  savedPills.innerHTML = '';
  Object.entries(PROVIDERS).forEach(([id, cfg]) => {
    const span = document.createElement('span');
    const ok = !!keys[id];
    span.className = 'pill' + (ok ? ' on' : '');
    span.textContent = ok ? `✓ ${cfg.label} 已存` : `${cfg.label} 未設`;
    span.onclick = () => {
      providerSelect.value = id;
      syncModalFields(id);
    };
    savedPills.appendChild(span);
  });
}

function syncModalFields(providerId) {
  const cfg = PROVIDERS[providerId];
  const keys = getKeys();
  const models = getModels();

  apiKeyInput.value = keys[providerId] || '';
  apiKeyInput.placeholder = cfg.placeholder;
  apiModelInput.value = models[providerId] || cfg.defaultModel;
  keyLink.href = cfg.keyUrl;
  detectMsg.textContent = '';

  const list = liveModelCache[providerId] || cfg.presets;
  renderModelChips(list);
}

function openModal() {
  const active = getActiveProvider();
  providerSelect.value = active;
  syncModalFields(active);
  renderSavedPills();
  modal.classList.add('open');
}

function closeModal() {
  modal.classList.remove('open');
}

function initWelcome() {
  log.innerHTML = '';
  hist = [];
  chipBox.style.display = 'flex';
  add('bot', '坐。\n我是**小撲**。別管我戴墨鏡，你的牌我不看，我只看你的決策。\n\n我會帶你把打法磨成接近 GTO：**混合頻率、多種尺度下注、用對手行動線決定 Hero Call**，再教你什麼時候該偏離、怎麼剝削。\n\n- 丟我**位置＋手牌＋行動線＋下注額**，我給結論再拆理由\n- 若晚間尖峰遇到塞車，系統會自動偵測並切換同組 Key 下的可用備援模型（含 Gemma 3）');
}

async function fetchModelsForProvider(providerId, apiKey) {
  const cfg = PROVIDERS[providerId];
  const key = cleanKey(apiKey);
  if (!key) throw new Error('請先貼上 API Key');

  if (cfg.type === 'gemini') {
    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${encodeURIComponent(key)}`, {
      mode: 'cors',
      credentials: 'omit',
      referrerPolicy: 'no-referrer'
    });
    const data = await res.json();
    if (!res.ok) throw { status: res.status, message: data?.error?.message || `HTTP ${res.status}` };

    const list = (data.models || [])
      .filter(m =>
        Array.isArray(m.supportedGenerationMethods) &&
        m.supportedGenerationMethods.includes('generateContent') &&
        (m.name.includes('gemini') || m.name.includes('gemma-3')) &&
        !/embedding|imagen|veo|tts|audio|aqa|bisect|robotics|computer-use|deep-research|nano-banana|exp/i.test(m.name)
      )
      .map(m => m.name.replace(/^models\//, ''));

    // 排序：Flash-Lite -> Flash -> Pro -> Gemma-3-27b -> 其他 Gemma-3
    list.sort((a, b) => {
      const score = s => {
        if (s.includes('flash-lite')) return 0;
        if (s.includes('flash')) return 1;
        if (s.includes('pro')) return 2;
        if (s.includes('gemma-3-27b')) return 3;
        if (s.includes('gemma-3')) return 4;
        return 5;
      };
      return score(a) - score(b);
    });
    liveModelCache[providerId] = list;
    return list;
  } else {
    const res = await fetch(cfg.modelsUrl, {
      mode: 'cors',
      credentials: 'omit',
      referrerPolicy: 'no-referrer',
      headers: { 'Authorization': `Bearer ${key}` }
    });
    const data = await res.json();
    if (!res.ok) throw { status: res.status, message: data?.error?.message || `HTTP ${res.status}` };
    let list = (data.data || []).map(m => m.id).filter(Boolean);
    if (providerId === 'groq') {
      list = list.filter(id => !/whisper|guard|tts|audio|vision|safeguard/i.test(id));
    } else if (providerId === 'openrouter') {
      const freeFirst = list.filter(id => id.endsWith(':free'));
      const others = list.filter(id => !id.endsWith(':free'));
      list = [...freeFirst, ...others].slice(0, 40);
    }
    liveModelCache[providerId] = list;
    return list;
  }
}

async function callSingleModel(providerId, apiKey, model, recent) {
  const cfg = PROVIDERS[providerId];
  const key = cleanKey(apiKey);

  if (cfg.type === 'gemini') {
    const isGemma = model.toLowerCase().includes('gemma');
    const contents = recent.map((m, idx) => {
      let text = m.content;
      // Gemma 系列不支援 systemInstruction，自動將人設與知識庫併入首則提問
      if (isGemma && idx === 0 && m.role === 'user') {
        text = KB + '\n\n【學員提問】\n' + text;
      }
      return {
        role: m.role === 'assistant' ? 'model' : 'user',
        parts: [{ text }]
      };
    });

    const payload = {
      contents,
      generationConfig: { temperature: 0.7 }
    };
    if (!isGemma) {
      payload.systemInstruction = { parts: [{ text: KB }] };
    }

    const url = `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent?key=${encodeURIComponent(key)}`;
    const res = await fetch(url, {
      method: 'POST',
      mode: 'cors',
      credentials: 'omit',
      referrerPolicy: 'no-referrer',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    const data = await res.json();
    if (!res.ok) throw { status: res.status, message: data?.error?.message || `HTTP ${res.status}` };
    const text = data?.candidates?.[0]?.content?.parts?.[0]?.text;
    if (!text) throw { status: 500, message: '模型未回傳文字' };
    return text;
  } else {
    const messages = [{ role: 'system', content: KB }, ...recent];
    const res = await fetch(cfg.chatUrl, {
      method: 'POST',
      mode: 'cors',
      credentials: 'omit',
      referrerPolicy: 'no-referrer',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${key}`
      },
      body: JSON.stringify({
        model,
        messages,
        temperature: 0.7
      })
    });
    const data = await res.json();
    if (!res.ok) throw { status: res.status, message: data?.error?.message || `HTTP ${res.status}` };
    const text = data?.choices?.[0]?.message?.content;
    if (!text) throw { status: 500, message: '模型未回傳文字' };
    return text;
  }
}

async function ask(text) {
  if (busy || !text.trim()) return;

  const keys = getKeys();
  if (Object.keys(keys).length === 0) {
    openModal();
    return;
  }

  busy = true;
  send.disabled = true;
  chipBox.style.display = 'none';

  add('me', text);
  hist.push({ role: 'user', content: text });
  const bub = add('bot', '…（壓低帽簷，盯著籌碼）');

  try {
    let recent = hist.slice(-12);
    if (recent[0].role !== 'user') recent = recent.slice(1);

    const primary = getActiveProvider();
    const savedModels = getModels();
    const providerOrder = [primary, ...Object.keys(keys)].filter((v, i, a) => keys[v] && a.indexOf(v) === i);

    let reply = null;
    let lastErr = null;

    for (const pid of providerOrder) {
      const cfg = PROVIDERS[pid];
      const key = keys[pid];
      const chosenModel = (savedModels[pid] || '').replace(/^models\//, '');

      // 先動態向伺服器確認真實可用模型清單，避免試到不存在的模型名稱
      let realModels = liveModelCache[pid];
      if (!realModels) {
        try {
          realModels = await fetchModelsForProvider(pid, key);
        } catch (e) {
          lastErr = e;
          if (e.status === 400 || e.status === 401 || e.status === 403) continue;
          realModels = cfg.presets;
        }
      }

      // 若使用者有指定且存在於真實清單中，放第一位；否則依優先序跑真實清單
      const candidateModels = chosenModel && realModels.includes(chosenModel)
        ? [chosenModel, ...realModels.filter(m => m !== chosenModel)]
        : realModels;

      for (const m of candidateModels) {
        try {
          reply = await callSingleModel(pid, key, m, recent);
          if (pid !== primary || m !== chosenModel) {
            localStorage.setItem(STORE_PROVIDER, pid);
            setModel(pid, m);
            updateHeaderStatus();
          }
          break;
        } catch (e) {
          lastErr = e;
          if (e.status === 401 || e.status === 403) break;
          if (e.status === 503 || e.status === 429) {
            bub.innerHTML = md(`…（\`${m}\` 尖峰塞車，自動切換下一個可用模型…）`);
          }
        }
      }
      if (reply) break;
    }

    if (!reply) throw lastErr || new Error('所有已設定模型目前皆在尖峰負載中');

    bub.innerHTML = md(reply);
    hist.push({ role: 'assistant', content: reply });
  } catch (e) {
    hist.pop();
    const msg = String(e?.message || e || '網路異常');
    if (/failed to fetch|networkerror|load failed/i.test(msg)) {
      bub.innerHTML = md(
        '**連線被瀏覽器攔截（Failed to fetch）。** 請檢查：\n' +
        '- 關閉 `github.io` 頁面上的廣告攔截器／防追蹤擴充套件\n' +
        '- 或點右上角「⚙️」新增一組免費的 **Groq** Key 當作備援'
      );
    } else if (e.status === 401 || e.status === 403 || e.status === 400) {
      bub.innerHTML = md('**籌碼驗證沒過。** API Key 無效或權限不足（' + esc(msg) + '），點右上角「⚙️」檢查設定。');
    } else {
      bub.innerHTML = md(
        '目前所有模型都遇到晚間尖峰塞車（' + esc(msg) + '）。\n' +
        '- **最一勞永逸解法**：點右上角「⚙️」切到 **Groq** 申請免費 Key（`console.groq.com/keys`），幾乎零塞車且回覆極快。'
      );
    }
  } finally {
    busy = false;
    send.disabled = false;
    log.scrollTop = log.scrollHeight;
    t.focus();
  }
}

providerSelect.addEventListener('change', () => {
  syncModalFields(providerSelect.value);
});

detectBtn.addEventListener('click', async () => {
  const pid = providerSelect.value;
  const rawKey = apiKeyInput.value;
  detectBtn.disabled = true;
  detectMsg.textContent = '向伺服器查詢可用模型中…';
  try {
    const list = await fetchModelsForProvider(pid, rawKey);
    if (!list.length) {
      detectMsg.textContent = '查無可用模型';
      return;
    }
    apiModelInput.value = list[0];
    renderModelChips(list);
    detectMsg.textContent = `✓ 已抓到 ${list.length} 個可用模型（點擊下方標籤切換）`;
  } catch (e) {
    detectMsg.textContent = '偵測失敗：' + (e.message || '請確認網路或 Key');
  } finally {
    detectBtn.disabled = false;
  }
});

f.addEventListener('submit', e => {
  e.preventDefault();
  const v = t.value;
  if (!v.trim()) return;
  if (Object.keys(getKeys()).length === 0) {
    openModal();
    return;
  }
  t.value = '';
  ask(v);
});

t.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
    e.preventDefault();
    f.requestSubmit();
  }
});

cfgBtn.addEventListener('click', openModal);
document.getElementById('cancel-cfg').addEventListener('click', closeModal);
document.getElementById('save-cfg').addEventListener('click', () => {
  const pid = providerSelect.value;
  setKey(pid, apiKeyInput.value);
  setModel(pid, apiModelInput.value);
  localStorage.setItem(STORE_PROVIDER, pid);
  updateHeaderStatus();
  closeModal();
});
modal.addEventListener('click', e => { if (e.target === modal) closeModal(); });
clearBtn.addEventListener('click', initWelcome);

STARTER_CHIPS.forEach(c => {
  const b = document.createElement('button');
  b.type = 'button';
  b.textContent = c;
  b.onclick = () => ask(c);
  chipBox.appendChild(b);
});

updateHeaderStatus();
initWelcome();
</script>
</body>
</html>
